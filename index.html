<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cutting Room</title>
<meta name="description" content="100 procedurally generated instrumentals with an audio-reactive wireframe landscape.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080a;
    --panel: rgba(13, 14, 16, 0.72);
    --panel-border: rgba(220, 224, 228, 0.13);
    --text: #e4e6e8;
    --text-dim: #8b929a;
    --accent: #93a8b3;
    --accent-2: #6b8f8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #scene {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    background: var(--bg);
  }
  .veil {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 38%, rgba(7,8,10,0) 0%, rgba(7,8,10,0.35) 62%, rgba(7,8,10,0.82) 100%);
  }
  .wrap {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; justify-content: center;
    padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .panel {
    width: 100%; max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 18px 20px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .kicker {
    font-size: 12px; color: var(--accent); margin: 0;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 2px 0 0; }
  .landscape-name {
    font-size: 12px; color: var(--text-dim); text-align: right; white-space: nowrap;
  }
  .landscape-name b { color: var(--accent-2); font-weight: 600; }
  .np-meta {
    display: flex; flex-wrap: wrap; gap: 6px 16px;
    font-size: 12px; color: var(--text-dim); letter-spacing: 0.01em;
  }
  .np-meta b { color: var(--text); font-weight: 600; }
  .np-meta .pill {
    border: 1px solid var(--panel-border); border-radius: 999px; padding: 1px 9px; color: var(--accent);
  }
  audio { width: 100%; height: 34px; display: block; filter: invert(1) opacity(0.82) hue-rotate(180deg); }
  .transport { display: flex; gap: 8px; align-items: center; }
  .transport button {
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 9px 13px;
    border-radius: 10px; border: 1px solid var(--panel-border); background: rgba(224,228,232,0.06);
    color: var(--text); cursor: pointer; flex-shrink: 0;
  }
  .transport button:hover { border-color: var(--accent); color: var(--accent); }
  #shuffleBtn[aria-pressed="true"] { border-color: var(--accent-2); color: var(--accent-2); background: rgba(107,143,138,0.12); }
  select {
    flex: 1; min-width: 0; font-family: inherit; font-size: 13px; padding: 9px 11px;
    border-radius: 10px; border: 1px solid var(--panel-border); background: rgba(224,228,232,0.06);
    color: var(--text);
  }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12px; color: var(--text-dim); }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .dl-link { color: var(--text-dim); text-decoration: none; border-bottom: 1px solid var(--panel-border); margin-left: auto; }
  .dl-link:hover { color: var(--accent); border-color: var(--accent); }
  .hint {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 6;
    font-size: 12px; color: var(--text-dim); letter-spacing: 0.01em; text-align: center;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 999px;
    padding: 8px 16px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    cursor: pointer;
  }
  .hint[hidden] { display: none; }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="veil"></div>

  <div class="hint" id="startHint">tap anywhere to begin &middot; 100 takes, no two alike</div>

  <div class="wrap">
    <div class="panel">
      <div class="top-row">
        <div>
          <p class="kicker">Cutting Room &middot; 100 pieces</p>
          <h1 id="npTitle">&nbsp;</h1>
        </div>
        <div class="landscape-name">landscape<br><b id="npLandscape">&mdash;</b></div>
      </div>

      <div class="np-meta" id="npMeta"></div>

      <audio id="player" controls preload="none"></audio>

      <div class="transport">
        <button id="prevBtn" title="Previous track" aria-label="Previous track">&larr;</button>
        <select id="trackSelect" aria-label="Choose a track"></select>
        <button id="nextBtn" title="Next track" aria-label="Next track">&rarr;</button>
        <button id="shuffleBtn" title="Shuffle playback order" aria-label="Shuffle playback order" aria-pressed="false">shuffle</button>
      </div>

      <div class="toggles">
        <label><input type="checkbox" id="autoAdvance" checked> auto-advance</label>
        <label><input type="checkbox" id="loopPlaylist" checked> loop playlist</label>
        <a id="downloadMix" class="dl-link" href="https://github.com/micknoise/cutting-room/releases/download/shuffled-mix-v1/Cutting.Room.-.Shuffled.Mix.100.pieces.mp4" download>download shuffled mix (all 100, one file)</a>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="tracks.js?v=6"></script>
<script src="landscape.js?v=6"></script>
<script src="player.js?v=6"></script>
</body>
</html>
